<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>양상추 게임</title>

<style>

* { box-sizing: border-box;}

html,body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

#game {
    position: absolute;
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    max-width: 100vw;
    max-height: 100vh;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    /* 게임 화면을 기준으로 글자 크기도 계산 */
    container-type: inline-size;
}

/*배경 */
#background {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}


/*접시 */
#plate {
    position: absolute;
    left: 72%;
    top: 45%;
    width: 23%;
    height: auto;
    pointer-events: none;
}
/*물 영역*/
#water {
    position: absolute;
    left: 20%;
    top: 50%;
    width: 50%;
    height: 35%;
    z-index: 100;
    pointer-events: none;
}
/*물방울 */
.water-drop {
    position: absolute;
    background: linear-gradient(
        135deg,
        #ffffff,
        #8edcff,
        #3aaee8
    );
    border-radius: 50% 50% 55% 45%;
    box-shadow: 0 2px 5px rgba(0, 120, 200, 0.3);
    pointer-events: none;
    animation: waterFall 0.8s linear forwards;
}

.water-drop::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 6px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    opacity: 0.8;
}

@keyframes waterFall {

    0% { transform:  translateY(0) scale(0.8); opacity: 0; }
    15% { opacity: 1;}
    100% { transform: translateY(180px) scale(1);  opacity: 0; }
}

/*양상추*/
#lettuceDrag {
    position: absolute;
    left: 50%;
    top: 0;
    width: 23%;
    height: 32%;
    cursor: grab;
    touch-action: none;
    z-index: 200;
}

#lettuceDrag:active {
    cursor: grabbing;
}

#lettuce {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/*횟수*/
#count {
    position: absolute;
    left: 7%;
    top: 34%;
    font-size: 2.5cqw;
    z-index: 300;
}

/* 양상추 잎 */
.leaf {
    position: absolute;
    width: 9%;
    pointer-events: none;
    z-index: 150;
}

/*커서 가이드 이미지 */
#guideImage {
    position: fixed;
    left: 0;
    top: 0;
    /*clamp - 마우스따라다니는*/
    width: clamp(180px, 25vw, 550px);
    height: auto;
    z-index: 9999;
    pointer-events: none;
    transform: translate(15px, 15px);
}

/*결과 화면*/
.result {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    z-index: 1000;
}

.result img {
    width: min(35vw, 451px);
}

.result button {
    margin-top: 60px;
    width: min(24vw, 300px);
    height: 65px;
    border: 0;
    border-radius: 15px;
    background: #3c3c3c;
    color: white;
    font-size: clamp(16px, 2vw, 25px);
    cursor: pointer;
}

/* 모바일 */


/*모바일 물 버튼 */
#washButton {
    display: none;
    position: absolute;
    left: 50%;
    bottom: 4%;
    transform: translateX(-50%);
    /* 게임 화면 크기에 따라 같이 줄어듦 */
    width: 20%;
    height: 9%;
    border: none;
    border-radius: 2%;
    background: #3c3c3c;
    color: white;
    /* 게임 화면 너비 기준 */
    font-size: 2.2cqw;
    cursor: pointer;
    z-index: 500;
    touch-action: manipulation;
}
#washButton:active {
    transform: translateX(-50%) scale(0.95);
}

@media (max-width: 600px) {
    /* 모바일에서는 물 버튼 표시 */
    #washButton {display: block;}
    /* 모바일 양상추 크기 */
    #lettuceDrag {
        width: 30%;
        height: 25%;
    }
    /* 횟수 */
    #count {
        left: 5%;
        top: 28%;
        font-size: 2.5cqw;
    }
    /* 모바일 가이드 */
    #guideImage {
    #guideImage {
        position: fixed;
        left: 50%;
        bottom: 55%;
        width: 45vw;
        height: auto;
        transform: translateX(-50%);
    }
    }
    /* 결과 이미지 */
    .result img {
        width: 70%;
    }
    /* 결과 버튼 */
    .result button {
        margin-top: 5%;
        width: 24%;
        height: 9%;
        border-radius: 2%;
        font-size: 2.2cqw;
    }
}

</style>
</head>

<body>

<div id="game">

    <img id="background" src="images/lettucegame.png">
    <img id="plate" src="images/plate.png" >
    <img id="guideImage" src="images/guide1.png" >

    <div id="lettuceDrag">
        <img id="lettuce" src="images/lettuce2.png">
    </div>

    <div id="water"></div>
    <div id="count"> SPACE 0 / 20 </div>

    <button id="washButton">물 틀기 </button>

    <div  id="result" class="result">
        <img id="resultImage">
        <button id="resultButton"></button>
    </div>
</div>

<script>

/*요소 가져오기 */
const game = document.getElementById("game");
const lettuce = document.getElementById("lettuceDrag");
const countText = document.getElementById("count");
const result = document.getElementById("result");
const resultImage = document.getElementById("resultImage");
const button = document.getElementById("resultButton");
const guideImage = document.getElementById("guideImage");
const washButton =document.getElementById("washButton");

/*변수 */
let count = 0;
let inSink = false;
let startTime = null;
let dragging = false;
let leaves = [];

/*모바일인지 확인 */
function isMobile() {return window.innerWidth <= 1024 &&  window.matchMedia("(pointer: coarse)").matches;
}
/*초기 화면 설정 */
function updateDeviceUI() {

    if (isMobile()) {
        /* 모바일 */
        countText.textContent = `물 틀기 ${count} / 20`;
        if (isMobile()) { 
            washButton.style.display = "block";
        }
        else {
            washButton.style.display = "none";
        }        
        guideImage.style.left ="50%";
        guideImage.style.top ="auto";

    } else {
        /* PC */
        countText.textContent = `SPACE ${count} / 20`;
        washButton.style.display = "none";
    }
}

updateDeviceUI();

/*화면 크기 변경 */
window.addEventListener("orientationchange", () => {setTimeout(updateDeviceUI, 150);});

/*양상추 드래그 시작 */
lettuce.onpointerdown = (e) => {

    dragging = true;

    lettuce.setPointerCapture( e.pointerId );
};

/*양상추 이동*/
lettuce.onpointermove = (e) => {

    if (!dragging) return;
    const r = game.getBoundingClientRect();
    lettuce.style.left =  e.clientX - r.left - lettuce.offsetWidth / 2 + "px";
    lettuce.style.top = e.clientY - r.top - lettuce.offsetHeight / 2 + "px";
};

/*양상추 놓기 */

lettuce.onpointerup = () => {

    dragging = false;

    const l = lettuce.getBoundingClientRect();
    const gameRect = game.getBoundingClientRect();

    /* 싱크대 영역*/
    const s = {
        left: gameRect.left + gameRect.width * 0.01782,
        right: gameRect.left + gameRect.width * 0.74352,
        top: gameRect.top + gameRect.height *0.42613,
        bottom: gameRect.top +  gameRect.height * 0.97264
    };

    /* 양상추 중심부 */
    const centerX =
        (l.left + l.right) / 2;
    const centerY =
        (l.top + l.bottom) / 2;

    /* 중심부가 싱크대 안에 들어갔는지 확인 */
    if (
        centerX >= s.left &&
        centerX <= s.right &&

        centerY >= s.top &&
        centerY <= s.bottom &&
        !inSink
    ) {
        inSink = true;
        startTime = Date.now();
        /* 가이드 변경 */
        guideImage.src = "images/guide2.png";
    }
};
/*PC 가이드 */
document.addEventListener(
    "mousemove",
    (e) => {
        if (isMobile()) return;

        guideImage.style.left = e.clientX + "px";
        guideImage.style.top = e.clientY + "px";
    }
);
/*물 씻기 */
function washLettuce() {

    if  (
    !inSink ||count >= 20 
    ) 
    { return; }

    count++;

    /* PC / 모바일 표시 */
    if (isMobile()) {
        countText.textContent = `물 틀기 ${count} / 20`;
    }
    else {
        countText.textContent = `SPACE ${count} / 20`;
    }
    /* 잎 추가 */
    addLeaf();
    /* 물방울 10개 */
    for (
        let i = 0;i < 10; i++ ) { setTimeout( () => { createWaterDrop(); }, i * 80); }
    /* 성공 */
    if
    (count >= 20) {showResult(true);}
}
/*PC 스페이스바 */
document.onkeyup = (e) => { if ( e.code === "Space" ) { e.preventDefault(); washLettuce();}};

/*모바일 물 버튼*/
washButton.addEventListener( "pointerdown",(e) => { e.preventDefault();washLettuce();});

/*잎 추가*/
function addLeaf() {

    const leaf = document.createElement("img");

    leaf.src = "images/lettuce leaves.png";
    leaf.className = "leaf";
    leaf.style.left = 72 + Math.random() * 18 + "%";
    leaf.style.top = 48 +Math.random() * 15 +"%";

    game.appendChild(leaf);
    leaves.push(leaf);
}
/* 물방울 생성 */
function createWaterDrop() {

    const drop = document.createElement("div");

    drop.className ="water-drop";
    drop.style.left =Math.random() * 100 +"%";

    const size = 12 + Math.random() * 8;

    drop.style.width = size + "px";
    drop.style.height = size * 1.4 +"px";
    drop.style.animationDuration = 0.6 + Math.random() * 0.3 + "s";
    document
        .getElementById("water")
        .appendChild(drop);
    setTimeout(
        () => {drop.remove();}, 1000);
}
/*10초 제한*/
setInterval(
    () => {
        if (
            inSink &&
            startTime &&
            count < 20 &&
            Date.now() -
            startTime >=
            10000
)
{ showResult(false); }}, 100);
/*결과*/
function showResult(success) {
    guideImage.style.display ="none";
    leaves.forEach(
        (x) => { x.remove();}
    );

    leaves = [];

    resultImage.src =
        success
        ? "images/perfect.png"
        : "images/tryagain.png";

    button.textContent =
        success
        ? "화면 나가기"
        : "다시하기";

    result.style.display ="flex";

    button.onclick = () => {
        if (success) {
            window.parent.postMessage(
                {
                    action: "finishGame",
                    ingredient: "lettuce"
                },
                "*"
            );
            try {
                if (
                    typeof window
                        .parent
                        .finishGame ===
                    "function"
                ) {
                    window.parent.finishGame(
                        "lettuce"
                    );
                }
            } catch (e) {
                /* 무시 */
            }
        } else {
            reset();
        }
    };
}
/*다시하기*/
function reset() {
    count = 0;
    inSink = false;
    startTime = null;
    /* 횟수 초기화 */
    updateDeviceUI();
    /* 양상추 위치 */
    lettuce.style.left = "50%";
    lettuce.style.top ="0";
    /* 결과 화면 숨김 */
    result.style.display =
        "none";
    /* 가이드 다시 표시 */
    guideImage.style.display ="block";
    guideImage.src = "images/guide1.png";
}
</script>

</body>
</html>
